name: Alerte neige annoncée (MétéoSuisse Les Collines)

on:
  schedule:
    # 05:23 et 16:23 locales en hiver (UTC+1) — heures fixes, minutes décalées
    - cron: "23 4,15 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Analyser sans notifier ni enregistrer"
        type: boolean
        default: true
      seuil_cm:
        description: "Seuil en cm — surcharge ponctuelle (vide = variable SEUIL_NEIGE_CM, sinon 20)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: snow-forecast-alert
  cancel-in-progress: false

jobs:
  alerte:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Chemins d'échec (API refusée, muette, vide) sur fetch simulé :
      # un test en échec bloque le run, il apparaît en rouge.
      - name: Tests
        run: node --test test/snow.test.mjs

      - name: Vérifier les chutes annoncées
        env:
          NTFY_TOPIC_NEIGE: ${{ secrets.NTFY_TOPIC_NEIGE }}
          DRY_RUN: ${{ inputs.dry_run }}
          # Priorité : input manuel > variable de dépôt > défaut du script (20)
          SEUIL_CM: ${{ inputs.seuil_cm || vars.SEUIL_NEIGE_CM }}
        run: node snow-forecast-alert.mjs

      - name: Commit l'état si modifié
        if: always()
        run: |
          git config --global user.name "snow-alert-bot"
          git config --global user.email "snow-alert-bot@users.noreply.github.com"
          # Un par un : un git add avec un chemin absent n'ajoute RIEN.
          for f in snow-forecast-alerted.json data/neige.csv; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --staged --quiet; then
            echo "Rien à committer."
            exit 0
          fi
          git commit -m "chore: chute annoncée notifiée / journal neige [skip ci]"
          # wind-alert pousse aussi dans le dépôt : rebase avant push, 3 essais.
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
          echo "::error::push impossible après 3 essais"
          exit 1
