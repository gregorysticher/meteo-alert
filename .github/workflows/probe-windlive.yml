name: probe-windlive

# Sonde de decouverte, lancee a la main uniquement. Ne modifie rien.
on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node probe-windlive.mjs | tee -a "$GITHUB_STEP_SUMMARY"
