name: Alerte vent Reposoir

on:
  schedule:
    # 07:13 et 18:13 locales en été (UTC+2)
    - cron: "13 5,16 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Analyser sans notifier ni enregistrer"
        type: boolean
        default: true
      seuil_kn:
        description: "Seuil en nœuds — surcharge ponctuelle (vide = variable SEUIL_VENT_KN, sinon 12)"
        type: string
        default: ""
      min_heures:
        description: "Relevés consécutifs (vide = variable MIN_HEURES_VENT, sinon 4)"
        type: string
        default: ""
      horizon_jours:
        description: "Horizon en jours (vide = variable HORIZON_JOURS_VENT, sinon 7)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: wind-alert
  cancel-in-progress: false

jobs:
  alerte:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Analyser les prévisions de vent
        env:
          NTFY_TOPIC_VENT: ${{ secrets.NTFY_TOPIC_VENT }}
          DRY_RUN: ${{ inputs.dry_run }}
          # Priorité : input manuel > variable de dépôt > défaut du script
          SEUIL_KN: ${{ inputs.seuil_kn || vars.SEUIL_VENT_KN }}
          MIN_HEURES: ${{ inputs.min_heures || vars.MIN_HEURES_VENT }}
          HORIZON_JOURS: ${{ inputs.horizon_jours || vars.HORIZON_JOURS_VENT }}
        run: node wind-alert.mjs

      - name: Commit l'état si modifié
        if: always()
        run: |
          git config --global user.name "wind-alert-bot"
          git config --global user.email "wind-alert-bot@users.noreply.github.com"
          if [ -f alerted.json ]; then
            git add alerted.json
            git diff --staged --quiet || git commit -m "chore: fenêtres vent notifiées [skip ci]"
            git push
          else
            echo "alerted.json absent — rien à committer."
          fi
