name: wind-alert

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = ne rien notifier, afficher seulement"
        default: "1"
      qa_only:
        description: "1 = QA seul, pas de prevision ni d'alerte"
        default: "0"
      seuil_test:
        description: "Seuil en noeuds pour un envoi de TEST (vide = seuil normal). Marque l'alerte [TEST], n'ecrit ni alerted.json ni le journal QA."
        default: ""
  schedule:
    # Toutes les 2 h : les etages d'alerte sont bornes par l'ECHEANCE de la
    # fenetre, pas par l'heure du run. Inutile de viser une heure precise —
    # les crons planifies de GitHub derivent de plusieurs heures.
    - cron: "15 */2 * * *"

permissions:
  contents: write

concurrency:
  group: wind-alert
  cancel-in-progress: false

jobs:
  wind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Previsions, alertes et QA
        env:
          NTFY_TOPIC_VENT: ${{ secrets.NTFY_TOPIC_VENT }}
          TRMNL_WEBHOOK_URL: ${{ secrets.TRMNL_WEBHOOK_URL }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || '0' }}
          QA_ONLY: ${{ inputs.qa_only || '0' }}
          SEUIL_TEST: ${{ inputs.seuil_test || '' }}
        run: node wind-alert.mjs | tee -a "$GITHUB_STEP_SUMMARY"

      # Les donnees QA n'ont de valeur qu'accumulees : on commite a chaque run.
      - name: Commit des donnees
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ alerted.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "data: wind $(date -u +%FT%TZ)"
          git pull --rebase --autostash || true
          git push || true
