name: wind-alert

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = ne rien notifier, afficher seulement"
        default: "1"
      qa_only:
        description: "1 = appariement QA seul, pas de prevision"
        default: "0"
  schedule:
    # 05:00 UTC = 07:00 locale ete : alerte de planification du jour
    - cron: "0 5 * * *"
    # horaire : alimente la boucle QA (prevision archivee <-> mesure reelle)
    - cron: "30 * * * *"

permissions:
  contents: write

concurrency:
  group: wind-alert
  cancel-in-progress: false

jobs:
  wind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Alerte + previsions
        if: github.event.schedule != '30 * * * *'
        env:
          NTFY_TOPIC_VENT: ${{ secrets.NTFY_TOPIC_VENT }}
          TRMNL_WEBHOOK_URL: ${{ secrets.TRMNL_WEBHOOK_URL }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || '0' }}
          QA_ONLY: ${{ inputs.qa_only || '0' }}
        run: node wind-alert.mjs | tee -a "$GITHUB_STEP_SUMMARY"

      - name: QA seul (runs horaires)
        if: github.event.schedule == '30 * * * *'
        env:
          QA_ONLY: "1"
        run: node wind-alert.mjs | tee -a "$GITHUB_STEP_SUMMARY"

      # Les donnees QA n'ont de valeur qu'accumulees : on commite a chaque run.
      - name: Commit des donnees
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ alerted.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "data: wind $(date -u +%FT%TZ)"
          git pull --rebase --autostash || true
          git push || true
