name: wind-alert

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "1 = ne rien notifier, afficher seulement"
        default: "1"
      qa_only:
        description: "1 = QA seul, pas de prevision ni d'alerte"
        default: "0"
      seuil_test:
        description: "Seuil en noeuds pour un envoi de TEST (vide = seuil normal). Marque l'alerte [TEST], n'ecrit ni alerted.json ni le journal QA."
        default: ""
  schedule:
    # Heures fixes, minutes decalees (convention : GitHub livre mal les crons
    # a intervalle). Les etages d'alerte sont bornes par l'ECHEANCE de la
    # fenetre, pas par l'heure du run : l'heure exacte n'est pas critique.
    # Historique : "15 */2" (12 creneaux) ne livrait que 4 runs/jour, partis
    # avec 4 a 7 h de retard. 6 creneaux espaces de 4 h : a suivre (TODO).
    - cron: "17 1,5,9,13,17,21 * * *"

permissions:
  contents: write

concurrency:
  group: wind-alert
  cancel-in-progress: false

jobs:
  wind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Regle d'affichage TRMNL (choisirReco) sur donnees simulees : hors
      # saison, aucun run reel ne l'exerce. Un test en echec bloque le run.
      - name: Tests
        run: node --test test/reco.test.mjs test/qa.test.mjs

      - name: Previsions, alertes et QA
        # shell: bash explicite = -o pipefail. Sans lui, "| tee" masque le
        # code de sortie du script et un echec passe en vert (doc GitHub :
        # shell non specifie = "bash -e {0}", sans pipefail).
        shell: bash
        env:
          NTFY_TOPIC_VENT: ${{ secrets.NTFY_TOPIC_VENT }}
          TRMNL_WEBHOOK_URL: ${{ secrets.TRMNL_WEBHOOK_URL }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || '0' }}
          QA_ONLY: ${{ inputs.qa_only || '0' }}
          SEUIL_TEST: ${{ inputs.seuil_test || '' }}
        run: node wind-alert.mjs | tee -a "$GITHUB_STEP_SUMMARY"

      # Les donnees QA n'ont de valeur qu'accumulees : on commite a chaque run,
      # MEME si le script a echoue (always) — sinon une alerte partie avant
      # l'echec n'est pas memorisee dans alerted.json et repart en doublon.
      - name: Commit des donnees
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # Un par un : un git add avec un chemin absent n'ajoute RIEN.
          for f in data alerted.json; do
            if [ -e "$f" ]; then git add "$f"; fi
          done
          git diff --staged --quiet || git commit -m "data: wind $(date -u +%FT%TZ)"
          # Un push perdu = donnees QA perdues : 3 essais, puis run rouge.
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
          echo "::error::push des donnees QA impossible apres 3 essais"
          exit 1

      # GitHub avertit a 50 Mo et refuse a 100 Mo par fichier. Run rouge bien
      # avant, sinon les pushes echoueraient un jour sans prevenir. Apres le
      # commit : les donnees du run sont deja poussees.
      - name: Taille des fichiers de donnees
        if: always()
        run: |
          gros=$(find data -type f -size +45M)
          if [ -n "$gros" ]; then
            echo "::error::fichiers de donnees au-dessus de 45 Mo : $gros"
            exit 1
          fi
