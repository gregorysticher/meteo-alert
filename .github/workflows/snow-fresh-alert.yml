name: Alerte neige fraîche (SLF Les Collines)

on:
  schedule:
    # 06:47 et 17:47 locales en hiver (UTC+1) — heures fixes, minutes décalées.
    #
    # ESPACEMENT DE 11 H, PAS MOINS : les runs planifiés de ce compte partent
    # avec 4 à 7 h de retard, et un créneau qui tombe alors que le précédent
    # est encore en attente est abandonné. Avec les anciens créneaux 05:47 et
    # 11:47 (6 h d'écart), un jour sur deux ne recevait qu'un seul run.
    #
    # L'heure exacte n'est pas critique : le script prend le relevé SLF le
    # plus récent sur 3 jours, il ne suppose pas que celui du jour est publié.
    - cron: "47 5,16 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Analyser sans notifier ni enregistrer"
        type: boolean
        default: true
      ignorer_saison:
        description: "Forcer l'analyse hors saison (test en été)"
        type: boolean
        default: false
      seuil_cm:
        description: "Seuil en cm — surcharge ponctuelle (vide = variable SEUIL_NEIGE_FRAICHE_CM, sinon 20)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: snow-fresh-alert
  cancel-in-progress: false

jobs:
  alerte:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        # Un run en file part de la pointe, pas du SHA de son événement.
        with:
          ref: main

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Chemins d'échec (API refusée, muette, vide) sur fetch simulé :
      # un test en échec bloque le run, il apparaît en rouge.
      - name: Tests
        run: node --test test/snow.test.mjs

      - name: Vérifier la neige fraîche mesurée
        env:
          NTFY_TOPIC_NEIGE: ${{ secrets.NTFY_TOPIC_NEIGE }}
          DRY_RUN: ${{ inputs.dry_run }}
          IGNORER_SAISON: ${{ inputs.ignorer_saison }}
          SEUIL_CM: ${{ inputs.seuil_cm || vars.SEUIL_NEIGE_FRAICHE_CM }}
        run: node snow-fresh-alert.mjs

      - name: Commit l'état si modifié
        if: always()
        run: |
          git config --global user.name "snow-alert-bot"
          git config --global user.email "snow-alert-bot@users.noreply.github.com"
          # Un par un : un git add avec un chemin absent n'ajoute RIEN.
          for f in snow-fresh-alerted.json data/neige.csv; do
            if [ -f "$f" ]; then git add "$f"; fi
          done
          if git diff --staged --quiet; then
            echo "Rien à committer."
            exit 0
          fi
          git commit -m "chore: neige fraîche notifiée / journal neige [skip ci]"
          # wind-alert pousse aussi dans le dépôt : rebase avant push, 3 essais.
          for i in 1 2 3; do
            git pull --rebase --autostash && git push && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((i * 10))
          done
          echo "::error::push impossible après 3 essais"
          exit 1
