name: Alerte neige fraîche (SLF Les Collines)

on:
  schedule:
    # 06:47 et 17:47 locales en hiver (UTC+1) — heures fixes, minutes décalées.
    #
    # ESPACEMENT DE 11 H, PAS MOINS : les runs planifiés de ce compte partent
    # avec 4 à 7 h de retard, et un créneau qui tombe alors que le précédent
    # est encore en attente est abandonné. Avec les anciens créneaux 05:47 et
    # 11:47 (6 h d'écart), un jour sur deux ne recevait qu'un seul run.
    - cron: "47 5,16 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Analyser sans notifier ni enregistrer"
        type: boolean
        default: true
      seuil_cm:
        description: "Seuil en cm — surcharge ponctuelle (vide = variable SEUIL_NEIGE_FRAICHE_CM, sinon 20)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: snow-fresh-alert
  cancel-in-progress: false

jobs:
  alerte:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Vérifier la neige fraîche mesurée
        env:
          NTFY_TOPIC_NEIGE: ${{ secrets.NTFY_TOPIC_NEIGE }}
          DRY_RUN: ${{ inputs.dry_run }}
          SEUIL_CM: ${{ inputs.seuil_cm || vars.SEUIL_NEIGE_FRAICHE_CM }}
        run: node snow-fresh-alert.mjs

      - name: Commit l'état si modifié
        if: always()
        run: |
          git config --global user.name "snow-alert-bot"
          git config --global user.email "snow-alert-bot@users.noreply.github.com"
          if [ -f snow-fresh-alerted.json ]; then
            git add snow-fresh-alerted.json
            git diff --staged --quiet || git commit -m "chore: neige fraîche notifiée [skip ci]"
            git push
          else
            echo "snow-fresh-alerted.json absent — rien à committer."
          fi
