name: Alerte neige fraîche (SLF Les Collines)

on:
  schedule:
    # 06:47 et 12:47 locales en hiver (UTC+1)
    - cron: "47 5,11 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Analyser sans notifier ni enregistrer"
        type: boolean
        default: true
      seuil_cm:
        description: "Seuil en cm (vide = 20)"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: snow-fresh-alert
  cancel-in-progress: false

jobs:
  alerte:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Vérifier la neige fraîche
        env:
          NTFY_TOPIC_NEIGE: ${{ secrets.NTFY_TOPIC_NEIGE }}
          DRY_RUN: ${{ inputs.dry_run }}
          SEUIL_CM: ${{ inputs.seuil_cm }}
        run: node snow-fresh-alert.mjs
      - name: Commit l'état si modifié
        if: always()
        run: |
          git config --global user.name "snow-alert-bot"
          git config --global user.email "snow-alert-bot@users.noreply.github.com"
          if [ -f snow-fresh-alerted.json ]; then
            git add snow-fresh-alerted.json
            git diff --staged --quiet || git commit -m "chore: neige fraîche notifiée [skip ci]"
            git push
          else
            echo "Rien à committer."
          fi
