# Diagnostic temporaire (13/11/2026) : Open-Meteo injoignable depuis les runners. À supprimer.
name: diag-openmeteo
on: workflow_dispatch
permissions: {}
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - run: |
          U='https://api.open-meteo.com/v1/forecast?latitude=46.19&longitude=6.83&daily=snowfall_sum'
          curl -s https://api.ipify.org; echo
          getent ahosts api.open-meteo.com | head -3
          for i in $(seq 1 20); do
            curl -4 -s -o /dev/null --connect-timeout 8 -m 20 -w "essai $i %{http_code} %{time_connect}s\n" "$U" || echo "essai $i echec"
            sleep 5
          done
